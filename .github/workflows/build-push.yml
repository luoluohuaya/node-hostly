name: Build and push to Hostly Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Hostly Registry
        uses: docker/login-action@v3
        with:
          registry: registry.hostly.ninja
          username: ${{ secrets.HOSTLY_REGISTRY_USER }}
          password: ${{ secrets.HOSTLY_REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.hostly.ninja/xray-node/xray:latest
